<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Reflet Ambré</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--pearl:#FFFCF9;--blush:#FBEDEA;--blush2:#F3D6D1;--rose:#C98E89;--rose-d:#94594F;--gold:#D4AE6A;--ink:#2A1B19;--ink2:#5A413E;
  --ok:#4E8B6A;--okbg:#E6F2EA;--warn:#B7791F;--warnbg:#FBF0DC;--bad:#B4483F;--badbg:#F8E1DE}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--pearl);color:var(--ink);font-family:'Jost',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.script{font-family:'Great Vibes',cursive;font-weight:400}
.serif{font-family:'Cormorant Garamond',serif}
#fleurs{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* ===== CONNEXION ===== */
#login{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(90% 60% at 50% 30%,#fff,var(--blush) 60%,#f1d0ca);transition:opacity .7s,visibility 0s .7s}
#login.out{opacity:0;visibility:hidden}
.logo-rond{width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9a29c,var(--rose) 55%,var(--rose-d));display:grid;place-items:center;color:#fff;
  font-family:'Great Vibes';font-size:36px;line-height:.82;text-align:center;box-shadow:0 14px 34px -10px rgba(148,89,79,.7),0 0 0 5px #fff;position:relative;overflow:hidden}
.logo-rond::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);background-size:250% 100%;animation:sweep 3.5s ease-in-out infinite}
@keyframes sweep{from{background-position:120% 0}to{background-position:-120% 0}}
#login h1{font-family:'Cormorant Garamond';font-weight:600;font-size:28px;margin:22px 0 4px;position:relative;z-index:2}
#login p{color:var(--ink2);font-size:14px;position:relative;z-index:2}
.dots{display:flex;gap:16px;margin:26px 0;position:relative;z-index:2}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--rose);transition:.2s}
.dots i.on{background:var(--rose);transform:scale(1.15)}
.dots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;position:relative;z-index:2}
.pad button{height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:28px;font-family:'Cormorant Garamond';font-weight:600;color:var(--ink);box-shadow:0 8px 20px -14px var(--rose-d);transition:.15s}
.pad button:active{transform:scale(.92);background:var(--blush2)}
.pad .ghost{background:transparent;box-shadow:none;font-family:'Jost';font-size:13px;color:var(--ink2)}
.hint{margin-top:22px;font-size:12px;color:var(--ink2);position:relative;z-index:2}

/* ===== STRUCTURE ===== */
#app{position:relative;z-index:2;max-width:620px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 0 12px;background:linear-gradient(var(--pearl) 75%,rgba(255,252,249,0))}
.avatar{width:52px;height:52px;border-radius:50%;flex:none;overflow:hidden;border:2.5px solid #fff;box-shadow:0 6px 16px -8px var(--rose-d);background:var(--blush2);position:relative;cursor:pointer}
.avatar img,.avatar svg{width:100%;height:100%;object-fit:cover;display:block}
.top .hello{flex:1;min-width:0}
.top .hello small{display:block;font-size:12px;color:var(--ink2);text-transform:capitalize}
.top .hello b{font-family:'Cormorant Garamond';font-size:24px;font-weight:700}
.top .mini-logo{width:44px;height:44px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-family:'Great Vibes';font-size:15px;line-height:.8;text-align:center;flex:none}
h2.titre{font-family:'Cormorant Garamond';font-weight:700;font-size:30px;margin:8px 0 14px}
h2.titre em{font-family:'Great Vibes';font-style:normal;font-weight:400;color:var(--rose);font-size:1.2em}
.sous{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);font-weight:500;margin:22px 0 10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,252,249,.94);backdrop-filter:blur(12px);border-top:1px solid var(--blush)}
nav.tabs .in{display:flex;width:100%;max-width:620px}
nav.tabs button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--ink2);padding:6px 0;position:relative;font-weight:500}
nav.tabs svg{width:24px;height:24px}
nav.tabs button.on{color:var(--rose-d)}
nav.tabs button.on::before{content:"";position:absolute;top:-9px;width:28px;height:3px;border-radius:9px;background:var(--rose)}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:600}

/* cartes */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--blush);border-radius:18px;padding:14px 10px;text-align:center}
.stat b{display:block;font-family:'Cormorant Garamond';font-size:34px;font-weight:700;line-height:1;color:var(--rose-d)}
.stat span{font-size:12px;color:var(--ink2)}
.card{background:#fff;border:1px solid var(--blush);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 14px 30px -26px var(--rose-d);animation:pop .45s ease both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rdv-h{display:flex;align-items:flex-start;gap:12px}
.heure{flex:none;width:62px;text-align:center;background:var(--blush);border-radius:14px;padding:8px 0}
.heure b{display:block;font-family:'Cormorant Garamond';font-size:22px;font-weight:700;line-height:1}
.heure small{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.rdv-i{flex:1;min-width:0}
.rdv-i .nom{font-weight:600;font-size:17px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rdv-i .type{font-size:14px;color:var(--ink2);margin-top:2px}
.rdv-i .meta{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.5}
.msg{background:var(--blush);border-radius:12px;padding:10px 12px;font-size:14px;font-style:italic;color:var(--ink2);margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
.t-new{background:#EEF0FB;color:#4B57A6}.t-bon{background:var(--okbg);color:var(--ok)}.t-bad{background:var(--badbg);color:var(--bad)}
.t-att{background:var(--warnbg);color:var(--warn)}.t-conf{background:var(--okbg);color:var(--ok)}.t-ann{background:#EEE;color:#777}.t-venue{background:#E8EEF7;color:#41618F}.t-abs{background:var(--badbg);color:var(--bad)}.t-man{background:#F1ECF7;color:#6E4F96}
.alert-bad{background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px;font-weight:500}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.b{border:0;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1;min-width:0;transition:.15s}
.b:active{transform:scale(.97)}
.b-ok{background:linear-gradient(135deg,#6BAA87,var(--ok));color:#fff;box-shadow:0 8px 18px -10px var(--ok)}
.b-rose{background:linear-gradient(135deg,#d9a29c,var(--rose) 50%,var(--rose-d));color:#fff;box-shadow:0 8px 18px -10px var(--rose-d)}
.b-soft{background:var(--blush);color:var(--rose-d)}
.b-bad{background:var(--badbg);color:var(--bad)}
.b-line{background:#fff;color:var(--ink);border:1.5px solid var(--blush2)}
.b-sm{padding:8px 12px;font-size:13px;flex:none;border-radius:12px}
.vide{text-align:center;padding:40px 20px;color:var(--ink2)}
.vide .script{font-size:44px;color:var(--rose);display:block}

/* agenda */
.cal{background:#fff;border:1px solid var(--blush);border-radius:22px;padding:14px 12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-family:'Cormorant Garamond';font-size:24px;font-weight:700;text-transform:capitalize}
.cal-nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--blush2);background:var(--pearl);color:var(--rose-d);font-size:22px}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-w span{font-size:12px;font-weight:600;color:var(--ink2);padding:4px 0}
.cd{aspect-ratio:1;border-radius:14px;border:0;background:transparent;font-size:15px;color:var(--ink);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500}
.cd.off{color:#c9b8b4;background:repeating-linear-gradient(135deg,transparent 0 5px,#f6eeec 5px 7px)}
.cd.ferme{color:var(--bad);background:var(--badbg)}
.cd.today{box-shadow:inset 0 0 0 2px var(--gold)}
.cd.sel{background:linear-gradient(135deg,#d9a29c,var(--rose-d));color:#fff}
.cd .pts{display:flex;gap:2px;height:6px}
.cd .pts i{width:5px;height:5px;border-radius:50%;background:var(--ok)}
.cd .pts i.a{background:var(--warn)}
.cd.sel .pts i{background:#fff}
.leg{display:flex;justify-content:center;gap:12px;margin-top:10px;font-size:11px;color:var(--ink2);flex-wrap:wrap}
.leg span{display:flex;align-items:center;gap:5px}.leg i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* clientes */
.search{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--blush2);background:#fff;font-size:16px;font-family:inherit;outline:none;margin-bottom:10px}
.search:focus{border-color:var(--rose)}
.filtres{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.filtres button{border:1.5px solid var(--blush2);background:#fff;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.filtres button.on{background:var(--rose);border-color:var(--rose);color:#fff}
.cli{display:flex;align-items:center;gap:12px;cursor:pointer}
.ini{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:'Cormorant Garamond';font-weight:700;font-size:20px;color:#fff;background:linear-gradient(135deg,#e2b3ad,var(--rose))}
.ini.bad{background:linear-gradient(135deg,#d98a82,var(--bad))}
.ini.bon{background:linear-gradient(135deg,#8cc2a3,var(--ok))}
.cli .i{flex:1;min-width:0}.cli .i b{display:block;font-size:16px}.cli .i small{color:var(--ink2);font-size:13px}
.chev{color:var(--rose);font-size:22px}

/* feuille / modal */
.ov{position:fixed;inset:0;z-index:100;background:rgba(42,27,25,.4);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.35s}
.ov.open{opacity:1;visibility:visible}
.sheet{background:var(--pearl);width:100%;max-width:560px;max-height:92svh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px 26px;transform:translateY(100%);transition:.45s cubic-bezier(.2,.8,.2,1)}
.ov.open .sheet{transform:none}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px}}
.grab{width:44px;height:4px;border-radius:9px;background:var(--blush2);margin:0 auto 12px}
.sheet h3{font-family:'Cormorant Garamond';font-size:26px;font-weight:700;margin-bottom:12px}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin:14px 0 6px}
.inp,select.inp,textarea.inp{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--blush2);background:#fff;font-size:16px;font-family:inherit;color:var(--ink);outline:none}
.inp:focus{border-color:var(--rose)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--blush2);background:#fff;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:500;color:var(--ink)}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--blush);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:14px}
.tg{width:48px;height:28px;border-radius:99px;background:#ddd;position:relative;flex:none;border:0;transition:.25s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.tg.on{background:var(--ok)}.tg.on::after{left:23px}

/* aperçu messages */
.phone{background:#fff;border-radius:22px;border:1px solid var(--blush);padding:14px;margin-top:6px}
.phone .who{font-size:12px;color:var(--ink2);text-align:center;margin-bottom:8px}
.bulle{background:#E9E9EB;color:#111;border-radius:18px 18px 18px 4px;padding:10px 13px;font-size:14.5px;line-height:1.45;max-width:92%;white-space:pre-line}
.mail{background:#fff;border:1px solid var(--blush);border-radius:18px;overflow:hidden;margin-top:12px}
.mail .mh{background:linear-gradient(135deg,#d9a29c,var(--rose-d));color:#fff;padding:16px;text-align:center}
.mail .mh .script{font-size:34px;line-height:1}
.mail .mb{padding:14px 16px;font-size:14px;line-height:1.6;white-space:pre-line}
.mail .mt{font-size:12px;color:var(--ink2);padding:8px 16px;border-top:1px solid var(--blush)}
.envoye{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:var(--ok);font-weight:600;opacity:0}
.envoye.on{animation:pop .5s forwards}
.demo-note{font-size:11px;color:var(--ink2);text-align:center;margin-top:8px;letter-spacing:.05em}

.fete{display:flex;align-items:center;gap:12px}
.feuille{flex:none;width:56px;border-radius:12px;overflow:hidden;text-align:center;background:#fff;border:1px solid var(--blush2);box-shadow:0 6px 14px -10px var(--rose-d)}
.feuille small{display:block;background:var(--rose);color:#fff;font-size:10px;font-weight:600;letter-spacing:.08em;padding:3px 0;text-transform:uppercase}
.feuille b{display:block;font-family:'Cormorant Garamond';font-size:24px;font-weight:700;line-height:1.3}
.fete .i{flex:1;min-width:0}.fete .i b{font-size:16px;display:block}.fete .i small{font-size:12.5px;color:var(--ink2)}
.cdmini{font-size:12.5px;font-weight:600;color:var(--rose-d);margin-top:2px}
.hero-cd{background:linear-gradient(135deg,#d9a29c,var(--rose) 50%,var(--rose-d));color:#fff;border-radius:24px;padding:20px 18px;text-align:center;position:relative;overflow:hidden;box-shadow:0 18px 34px -20px var(--rose-d)}
.hero-cd .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.hero-cd h3{font-family:'Cormorant Garamond';font-size:30px;font-weight:700;margin:4px 0 12px}
.cd-row{display:flex;justify-content:center;gap:8px}
.cd-row div{background:rgba(255,255,255,.18);border-radius:14px;min-width:62px;padding:8px 4px}
.cd-row b{display:block;font-family:'Cormorant Garamond';font-size:32px;font-weight:700;line-height:1}
.cd-row small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.hero-cd .bulle{background:rgba(255,255,255,.95);color:var(--ink);margin:14px auto 0;text-align:left;font-size:14px}
.hero-cd .who2{font-size:12px;margin-top:10px;opacity:.95}
.pick{max-height:240px;overflow:auto;border:1px solid var(--blush);border-radius:14px;background:#fff;margin-top:8px}
.pick label{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--blush);font-size:14px}
.pick input{width:20px;height:20px;accent-color:var(--rose)}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--blush);font-size:13.5px}
.hist:last-child{border:0}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:300;opacity:0;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#coeurs{position:fixed;inset:0;pointer-events:none;z-index:250}
.fab{position:fixed;right:18px;bottom:92px;z-index:35;width:60px;height:60px;border-radius:50%;border:0;color:#fff;font-size:30px;background:linear-gradient(135deg,#d9a29c,var(--rose) 50%,var(--rose-d));box-shadow:0 12px 26px -8px var(--rose-d)}
@media(min-width:660px){.fab{right:calc(50% - 300px)}}
.set-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--blush)}
.set-row:last-child{border:0}
.set-row .j{width:74px;flex:none;font-weight:600;text-transform:capitalize;font-size:14px}
.set-row input[type=time]{padding:6px 4px;border-radius:10px;border:1.5px solid var(--blush2);font-family:inherit;font-size:13px;width:0;flex:1;min-width:0}
.set-row{gap:6px}.set-row .tg{flex:none}
.logo-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.logo-rond,.mini-logo{padding:0;overflow:hidden}

/* couleur ambre */
:root{--rose:#C9852E;--rose-d:#8A5418;--blush:#FBF0E1;--blush2:#F0DCC0}
.b-rose,.fab,#fab{background:linear-gradient(135deg,#E8B25A,#C9852E 50%,#9A5E1C)!important}
.chip.on,.filtres button.on{background:#C9852E!important;border-color:#C9852E!important}
.tl{padding:6px 12px}.tl-r{display:flex;gap:10px;min-height:36px;border-top:1px dashed rgba(150,120,100,.25)}.tl-r:first-child{border-top:0}.tl-r>span{width:44px;flex:none;font-size:13px;font-weight:600;color:var(--ink2);padding-top:9px}.tl-libre{flex:1;font-style:normal;font-size:12.5px;color:var(--ink2);opacity:.55;padding-top:9px;cursor:pointer}.tl-occ{flex:1;font-style:normal;font-size:13px;line-height:1.35;background:rgba(47,122,79,.13);border-left:4px solid var(--ok);padding:6px 9px;margin:-1px 0}.tl-occ.att{background:rgba(201,138,43,.16);border-left-color:var(--warn)}
.chips.grille30{display:grid!important;grid-template-columns:repeat(4,1fr);gap:6px}.chip.case{padding:8px 0;text-align:center;line-height:1.15}.chip.case small{display:block;font-size:10px;opacity:.85}.chip.case.pris{background:rgba(180,67,47,.13)!important;color:var(--bad)!important;border-color:transparent!important}.chip.case.court{opacity:.35}
.tl-occ.venue{background:rgba(120,120,120,.12);border-left-color:#9a8f86}
.gl{border:1.5px solid var(--line,#eadfce);border-radius:14px;overflow:hidden;background:var(--card,#fff)}.gl-r{display:flex;gap:12px;min-height:40px;align-items:center;padding:0 12px;border-top:1px dashed rgba(150,120,100,.25);cursor:pointer}.gl-r:first-child{border-top:0}.gl-r>span{width:44px;flex:none;font-weight:600;font-size:14px}.gl-r>i{flex:1;font-style:normal;font-size:12.5px;color:var(--ink2)}.gl-r.pris{background:rgba(180,67,47,.11)}.gl-r.pris>i{color:var(--ink)}.gl-r.suite{border-top:0}.gl-r.court{opacity:.4}.gl-r.on{background:linear-gradient(90deg,#e8b04b,#c98a2b);color:#fff}.gl-r.on>i{color:#fff;font-weight:600}.gl-r.suite2{border-top:0}.gl-act{padding:10px 12px;background:rgba(180,67,47,.06);border-top:1px solid rgba(180,67,47,.2)}.gl-act .b{margin:3px 2px}.gl-vide{padding:14px;color:var(--ink2);font-size:13px}
</style>
</head>
<body>
<canvas id="fleurs"></canvas>
<canvas id="coeurs"></canvas>

let _actx=null;
function ding(type){try{_actx=_actx||new (window.AudioContext||window.webkitAudioContext)();const A=_actx;if(A.state==='suspended')A.resume();
  const notes=type==='sms'?[1046.5,1318.5,1568]:[784,1174.7,1568];const t0=A.currentTime+.02;
  notes.forEach((f,i)=>{const o=A.createOscillator(),g=A.createGain(),o2=A.createOscillator(),g2=A.createGain();
    o.type='sine';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2.01;
    const t=t0+i*.12;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+1.3);
    g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(.04,t+.01);g2.gain.exponentialRampToValueAtTime(.0001,t+.6);
    o.connect(g);g.connect(A.destination);o2.connect(g2);g2.connect(A.destination);o.start(t);o2.start(t);o.stop(t+1.4);o2.stop(t+.7)})}catch(e){}}
function apercuMessages(r,titre,smsTxt,mailTitre,mailTxt,apres){const c=getC(r.cid);
  ouvrir(`<h3>${titre}</h3>
  <div class="lbl">SMS envoyé au ${esc(c.tel)}</div><div class="phone"><div class="who">Reflet Ambré</div><div class="bulle">${esc(smsTxt)}</div></div>
  <div class="envoye" id="env">${LIVE?'Envoi du SMS…':'✓ SMS envoyé à '+esc(c.prenom)}</div>
  ${LIVE?'':'<div class="demo-note">APERÇU · aucun message réellement envoyé</div>'}
  <button class="b b-rose" style="width:100%;margin-top:14px" onclick="fermer()">Parfait</button>`);
  if(LIVE){RA_sync().then(()=>API('sms',{envois:[{tel:c.tel,texte:smsTxt}]})).then(d=>{const e=$('#env');if(!e)return;e.textContent=d&&d.envoyes?'✓ SMS envoyé à '+c.prenom:'⚠ SMS non envoyé : '+((d&&(d.raison||d.erreur))||'pas de connexion')+'. Appelez-la ☏';if(!(d&&d.envoyes))e.style.background='#FBE3DF',e.style.color='#9A3B2E';else ding('sms');e.classList.add('on');apres&&apres()}).catch(()=>{const e=$('#env');if(e){e.textContent='⚠ Pas de connexion : SMS non envoyé';e.classList.add('on')}});return}
  setTimeout(()=>{$('#env')&&$('#env').classList.add('on');ding('sms');apres&&apres()},700)}

function valider(id){const r=R.find(x=>x.id===id);const c=getC(r.cid);
  const go2=()=>{r.statut='confirme';render();apercuMessages(r,'RDV confirmé ♡',fill(S.sms,r),'Votre rendez-vous est confirmé',fill(S.mail,r),()=>coeurs(innerWidth/2,innerHeight*.3,50))};
  if(c.statut==='mauvais'){ouvrir(`<h3>⚠ Mauvaise cliente</h3><p style="line-height:1.6">${esc(c.prenom)} ${esc(c.nom)} est marquée comme mauvaise cliente :<br><b>${esc(c.note||'—')}</b></p><p style="margin-top:10px;color:var(--ink2)">Voulez-vous quand même confirmer son RDV ?</p>

function annuler(id){const r=R.find(x=>x.id===id);const c=getC(r.cid);const att=r.statut==='attente';

function presence(id,st){const r=R.find(x=>x.id===id);r.statut=st;const c=getC(r.cid);
  if(st==='absente'){const n=R.filter(x=>x.cid===c.id&&x.statut==='absente').length;
    ouvrir(`<h3>${esc(c.prenom)} n'est pas venue</h3><p style="line-height:1.6">C'est la <b>${n}${n>1?'e':'re'} fois</b> qu'elle ne vient pas.</p>

    const txt=()=>`Bonjour ${c.prenom}, nous vous attendions aujourd'hui à ${r.heure} chez Reflet Ambré mais vous n'êtes pas venue. Comme indiqué lors de la réservation, des frais d'absence de ${$('#amv').value} € vous sont demandés. Pour reprendre RDV : 0475 72 18 52. Dori`;
    const maj=()=>$('#amp').textContent=txt();maj();

    $('#amb').onclick=e=>e.target.classList.toggle('on');
    document.querySelectorAll('#amc .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#amc .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#amv').value=b.dataset.v;maj()});
    $('#amv').oninput=()=>{document.querySelectorAll('#amc .chip').forEach(x=>x.classList.toggle('on',x.dataset.v===$('#amv').value));maj()};
    $('#amok').onclick=()=>{const fine=$('#amt').classList.contains('on')&&+$('#amv').value>0;
      if(fine)c.amendes.push({id:Date.now(),date:r.date,montant:+$('#amv').value,payee:false});
      if($('#amb').classList.contains('on')){c.statut='mauvais';c.note=`${n} RDV non venu${n>1?'s':''} sans prévenir`}
      fermer();render();toast(fine?`Amende de ${$('#amv').value} € ajoutée · SMS envoyé à ${c.prenom}`:'Absence enregistrée')}}

/* ---------- AGENDA ---------- */
let view=new Date(TODAY.getFullYear(),TODAY.getMonth(),1),selD=T;
function vAgenda(){
  const first=(view.getDay()+6)%7,n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  let g='';for(let k=0;k<first;k++)g+='<span></span>';
  for(let d=1;d<=n;d++){const s=iso(new Date(view.getFullYear(),view.getMonth(),d)),dd=parse(s);
    const l=R.filter(r=>r.date===s&&(r.statut==='confirme'||r.statut==='attente'||r.statut==='venue'));
    const off=!S.horaires[dd.getDay()],fer=S.fermes.includes(s);
    g+=`<button class="cd ${off?'off':''} ${fer?'ferme':''} ${s===T?'today':''} ${s===selD?'sel':''}" onclick="selDay('${s}')">${d}<span class="pts">${l.slice(0,3).map(r=>`<i class="${r.statut==='attente'?'a':''}"></i>`).join('')}</span></button>`}
  const jour=R.filter(r=>r.date===selD&&r.statut!=='annule').sort((a,b)=>a.heure.localeCompare(b.heure));
  const sd=parse(selD),off=!S.horaires[sd.getDay()],fer=S.fermes.includes(selD);
  $('#main').innerHTML=`<h2 class="titre">Mon <em>agenda</em></h2>
  <div class="acts" style="margin:0 0 10px"><button class="b b-rose" onclick="ajouter(selD>T?selD:null)">＋ RDV à la main</button><button class="b b-soft" onclick="vacances()">🏖 Vacances / fermer</button></div>
  ${S.fermes.filter(d=>d>=T).length?`<div class="card" style="font-size:13.5px;line-height:1.6;margin-bottom:10px"><b>Jours fermés à venir :</b> ${S.fermes.filter(d=>d>=T).sort().map(d=>fmtC(d)).join(', ')} <button class="b b-line b-sm" style="margin-left:6px" onclick="S.fermes=S.fermes.filter(d=>d<T);vAgenda();toast('Tous les jours rouverts')">Tout rouvrir</button></div>`:''}
  <button class="b b-line" style="width:100%;margin-bottom:12px" onclick="vHisto()">🕓 Historique des RDV (12 derniers mois)</button>
  <div class="cal"><div class="cal-h"><button class="cal-nav" onclick="mois(-1)">‹</button><b>${MOIS[view.getMonth()]} ${view.getFullYear()}</b><button class="cal-nav" onclick="mois(1)">›</button></div>
  <div class="cal-w"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="cal-g">${g}</div>
  <div class="leg"><span><i style="background:var(--ok)"></i>Confirmé</span><span><i style="background:var(--warn)"></i>À valider</span><span><i style="background:var(--badbg);border:1px solid var(--bad)"></i>Congé</span></div></div>
  <div class="sous" style="display:flex;justify-content:space-between;align-items:center">${fmtL(selD)}
    ${off?'':`<button class="b b-line b-sm" onclick="conge('${selD}')">${fer?'Rouvrir ce jour':'Fermer ce jour'}</button>`}</div>
  ${off?'<div class="vide">Boutique fermée ce jour-là.</div>':fer?'<div class="vide"><span class="script">Jour de congé</span>Aucun RDV ne peut être pris sur le site.</div>':''}
  ${!off&&!fer?journee(selD,jour):''}
  ${jour.filter(r=>!(grille(selD).length&&enGrille(r))).map(r=>carte(r)).join('')}
  ${!off&&!fer?`<button class="b b-soft" style="width:100%" onclick="ajouter('${selD}')">+ Ajouter un RDV ce jour</button>`:''}`}
function selDay(s){selD=s;vAgenda()}
function mois(k){view=new Date(view.getFullYear(),view.getMonth()+k,1);vAgenda()}
function vacances(){ouvrir(`<h3>🏖 Vacances ou fermeture</h3><p style="color:var(--ink2);font-size:14px">Choisissez les jours où la boutique est fermée. Les clientes ne pourront pas prendre RDV ces jours-là sur le site.</p>
  <div class="row2"><div><div class="lbl">Du</div><input class="inp" type="date" id="vd" value="${T}" min="${T}"></div><div><div class="lbl">Au</div><input class="inp" type="date" id="vf" value="${iso(addD(TODAY,7))}" min="${T}"></div></div>
  <div id="vinfo" style="font-size:13px;color:var(--ink2);margin-top:8px"></div>
  <div class="acts"><button class="b b-line" onclick="fermer()">Retour</button><button class="b b-rose" id="vok">Fermer ces jours</button></div>`);
  const maj=()=>{const a=$('#vd').value,b=$('#vf').value;if(!a||!b||b<a){$('#vinfo').textContent='Choisissez une date de fin après le début.';return}
    const l=R.filter(r=>r.date>=a&&r.date<=b&&(r.statut==='confirme'||r.statut==='attente'));$('#vinfo').innerHTML=l.length?`⚠ <b>${l.length} RDV</b> déjà prévus pendant ces jours : pensez à les déplacer ou les annuler.`:'Aucun RDV prévu pendant ces jours ✓'};
  $('#vd').onchange=maj;$('#vf').onchange=maj;maj();
  $('#vok').onclick=()=>{const a=$('#vd').value,b=$('#vf').value;if(!a||!b||b<a){toast('Dates à vérifier');return}let d=parse(a),n=0;while(iso(d)<=b){const k=iso(d);if(S.horaires[d.getDay()]&&!S.fermes.includes(k)){S.fermes.push(k);n++}d=addD(d,1)}
    fermer();vAgenda();toast(n+' jour(s) fermé(s) · bonnes vacances ☀')}}
function conge(s){const i=S.fermes.indexOf(s);if(i>=0){S.fermes.splice(i,1);toast('Jour rouvert')}else{S.fermes.push(s);toast('Jour fermé : plus de RDV possible sur le site')}vAgenda()}

  $('#aok').onclick=()=>{let c=cexist;

function decompte(ms){ms=Math.max(0,ms);const j=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return {j,h,m,s}}

const RA_DB_LOCAL={open(){return new Promise((ok,ko)=>{try{const r=indexedDB.open('reflet-ambre-site',1);r.onupgradeneeded=()=>{r.result.createObjectStore('medias',{keyPath:'id'});r.result.createObjectStore('reglages')};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}})},
  async all(){try{const db=await this.open();return await new Promise(ok=>{const q=db.transaction('medias').objectStore('medias').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>ok([])})}catch(e){return[]}},
  async put(m){const db=await this.open();return new Promise((ok,ko)=>{const t=db.transaction('medias','readwrite');t.objectStore('medias').put(m);t.oncomplete=ok;t.onerror=()=>ko(t.error)})},
  async del(id){const db=await this.open();return new Promise(ok=>{const t=db.transaction('medias','readwrite');t.objectStore('medias').delete(id);t.oncomplete=ok})},
  async get(k){try{const db=await this.open();return await new Promise(ok=>{const q=db.transaction('reglages').objectStore('reglages').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(undefined)})}catch(e){return undefined}},
  async set(k,v){const db=await this.open();return new Promise(ok=>{const t=db.transaction('reglages','readwrite');t.objectStore('reglages').put(v,k);t.oncomplete=ok})}};
const SUPA_PUB='/storage/v1/object/public/site/';
const chemin=u=>typeof u==='string'&&u.includes(SUPA_PUB)?decodeURIComponent(u.split(SUPA_PUB)[1]):u;
async function deposer(blob,dossier){const ext=((blob.type||'').split('/')[1]||'bin').replace('jpeg','jpg').replace('quicktime','mov').replace('mpeg','mp3').slice(0,5);
  const e=await API('envoi',{ext,dossier});if(!e.ok)throw new Error(e.erreur);
  const fd=new FormData();fd.append('cacheControl','31536000');fd.append('',blob);
  const r=await fetch(e.envoi,{method:'PUT',headers:{'x-upsert':'false'},body:fd});if(!r.ok)throw new Error('envoi '+r.status);return e.chemin}
async function siteData(){try{return await fetch(RA_API+'?f=site').then(r=>r.json())}catch(e){return{}}}
const RA_DB=LIVE?{
  all:async()=>(await siteData()).medias||[],
  async put(m){const c=await deposer(m.blob,'medias');const d=await API('media_ajout',{media:{id:m.id,type:m.type,cat:m.cat,haut:m.haut,legende:m.legende,date:m.date,chemin:c}});if(!d.ok)throw new Error(d.erreur)},
  async del(id){await API('media_suppr',{id})},
  async get(k){const d=await siteData();if(k==='favoris')return((d.apropos)||{}).favoris||null;return d[k]},
  async set(k,v){let val=v;
    if(k==='favoris'||k==='apropos'){const cur=(await siteData()).apropos||{};
      if(k==='favoris'){const d=await API('reglage',{cle:'apropos',valeur:{...cur,photo:chemin(cur.photo)||null,favoris:v}});if(!d.ok)toast('⚠ '+(d.erreur||'Non enregistré'));return}
      v={...v,favoris:cur.favoris||null}}
    val=v;
    if(v instanceof Blob)val=await deposer(v,'musique');
    else if(v&&typeof v==='object'&&'photo' in v){val={...v};val.photo=v.photo instanceof Blob?await deposer(v.photo,'apropos'):chemin(v.photo)}
    else if(typeof v==='string')val=chemin(v);

    <button class="tg ${h?'on':''}" style="margin-left:auto" onclick="S.horaires[${j}]=S.horaires[${j}]?null:['10:00','18:00'];vReglages()"></button></div>`}).join('')}</div>
  <div class="sous">Mes heures de RDV (toutes les 30 min)</div><div class="card">
    ${[2,3,4,5,6,0,1].filter(j=>S.horaires[j]).map(j=>{const w=(S.rdvJour||RDVJ_DEF)[j]||['10:00','16:30'];return `<div class="set-row"><span class="j">${JL[j]}</span>
    <input type="time" step="1800" value="${w[0]}" onchange="rjSet(${j},0,this.value)"> – <input type="time" step="1800" value="${w[1]}" onchange="rjSet(${j},1,this.value)"></div>`}).join('')}
    <small style="color:var(--ink2);display:block;margin-top:8px">1re heure = premier RDV, 2e heure = dernier RDV. Les clientes voient un créneau toutes les 30 min entre les deux. Un RDV de 2 h prend 4 créneaux.</small></div>
  <div class="sous">Me prévenir</div><div class="card">
    <div class="switch" style="margin-top:0">📱 Recevoir un SMS à chaque nouvelle demande<button class="tg ${S.notif.on?'on':''}" onclick="S.notif.on=!S.notif.on;this.classList.toggle('on')"></button></div>
    <div class="lbl">Sur mon numéro</div><input class="inp" type="tel" value="${esc(S.notif.tel)}" oninput="S.notif.tel=this.value">
    <div class="switch">⏰ Me rappeler si je n'ai pas répondu<button class="tg ${S.relance.on?'on':''}" onclick="S.relance.on=!S.relance.on;this.classList.toggle('on')"></button></div>
    <div class="lbl">Après</div><select class="inp" onchange="S.relance.h=+this.value">${[12,24,48].map(h=>`<option value="${h}" ${S.relance.h===h?'selected':''}>${h} heures sans réponse</option>`).join('')}</select>
    <p style="font-size:12px;color:var(--ink2);margin-top:8px">Pour qu'aucune cliente n'attende son SMS de confirmation trop longtemps.</p></div>
  <div class="sous">Sauvegarde</div><div class="card"><p style="font-size:14px;color:var(--ink2);margin-bottom:10px">Téléchargez vos données en fichier Excel, à garder sur votre ordinateur.</p>
    <button class="b b-rose" style="width:100%;margin-bottom:8px" onclick="exporter('clientes')">📥 Mes clientes</button>
    <button class="b b-soft" style="width:100%" onclick="exporter('rdv')">📥 Tous mes RDV (1 an)</button></div>
  <div class="sous">SMS de confirmation</div><textarea class="inp" rows="4" oninput="S.sms=this.value">${esc(S.sms)}</textarea>
  <p style="font-size:12px;color:var(--ink2);margin-top:6px">Mots remplacés automatiquement : {prenom} {date} {heure} {type}</p>

  ${vAcces()}
  <button class="b b-line" style="width:100%;margin-top:16px" onclick="LS.del('ra_jeton');LS.del('ra_acces');location.reload()">Se déconnecter</button>
  <p class="demo-note" style="margin-top:18px">Panel réalisé par Atom · v4.3</p>`}

/* ================= FLEURS QUI TOMBENT ================= */
(function(){const c=$('#fleurs'),x=c.getContext('2d');let W,H,dpr;
  function size(){dpr=devicePixelRatio;W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
  const cols=['#f2c6bf','#e8b0a9','#f7d8d2','#ffffff','#f0dcae'];const ps=[];
  const mk=top=>({x:Math.random(),y:top?-.05:Math.random(),r:5+Math.random()*7,vy:.0005+Math.random()*.0009,ph:Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.02,c:cols[Math.random()*cols.length|0],a:.45+Math.random()*.35,f:Math.random()<.2});
  for(let i=0;i<(innerWidth<700?16:26);i++)ps.push(mk(false));
  const pet=r=>{x.beginPath();x.moveTo(0,-r);x.bezierCurveTo(r,-r*.6,r*.7,r*.8,0,r);x.bezierCurveTo(-r*.7,r*.8,-r,-r*.6,0,-r);x.fill()};
  (function f(t){x.clearRect(0,0,W,H);ps.forEach((p,i)=>{p.y+=p.vy;p.rot+=p.vr;if(p.y>1.05)ps[i]=mk(true);
    x.save();x.translate((p.x+Math.sin(t/1600+p.ph)*.03)*W,p.y*H);x.rotate(p.rot);x.globalAlpha=p.a;x.fillStyle=p.c;const r=p.r*dpr;
    if(p.f){for(let k=0;k<5;k++){x.save();x.rotate(k*1.2566);x.translate(0,-r*.7);pet(r*.6);x.restore()}x.fillStyle='#e9c77f';x.beginPath();x.arc(0,0,r*.28,0,7);x.fill()}else{x.scale(1,.55+.45*Math.sin(t/500+p.ph));pet(r)}
    x.restore()});requestAnimationFrame(f)})(0)})();

/* ================= PETITS CŒURS (quand on valide) ================= */
let hs=[],hRun=false;
function coeurs(cx,cy,n){const c=$('#coeurs'),x=c.getContext('2d'),dpr=devicePixelRatio;c.width=innerWidth*dpr;c.height=innerHeight*dpr;
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=3+Math.random()*7;hs.push({x:cx*dpr,y:cy*dpr,vx:Math.cos(a)*v*dpr,vy:(Math.sin(a)*v-4)*dpr,s:(8+Math.random()*10)*dpr,l:1,c:['#C98E89','#e8b0a9','#D4AE6A','#f2c6bf'][i%4]})}
  if(hRun)return;hRun=true;
  (function f(){x.clearRect(0,0,c.width,c.height);hs.forEach(h=>{h.vy+=.18*dpr;h.x+=h.vx;h.y+=h.vy;h.vx*=.98;h.l-=.012;
    x.save();x.globalAlpha=Math.max(h.l,0);x.translate(h.x,h.y);x.fillStyle=h.c;const s=h.s;x.beginPath();x.moveTo(0,s*.3);
    x.bezierCurveTo(0,0,-s*.5,0,-s*.5,s*.3);x.bezierCurveTo(-s*.5,s*.6,0,s*.8,0,s);x.bezierCurveTo(0,s*.8,s*.5,s*.6,s*.5,s*.3);x.bezierCurveTo(s*.5,0,0,0,0,s*.3);x.fill();x.restore()});
    hs=hs.filter(h=>h.l>0);if(hs.length)requestAnimationFrame(f);else{hRun=false;x.clearRect(0,0,c.width,c.height)}})()}

// ---------- RDV arrivé du site (démo) ----------
let nouveau=null;
(function(){let d=null;
  try{const q=new URLSearchParams(location.search).get('rdv');if(q)d=JSON.parse(q)}catch(e){}
  if(!d){try{const x=localStorage.getItem('ra_demo_rdv');if(x)d=JSON.parse(x)}catch(e){}}
  try{localStorage.removeItem('ra_demo_rdv')}catch(e){}
  if(LIVE||!d||!d.prenom)return;
  let c=C.find(x=>telN(x.tel)===telN(d.tel)&&telN(d.tel).length>8);
  if(!c){const mar=d.parrain?C.find(x=>telN(x.tel)===telN(d.parrain)):null;c=cli(d.prenom,d.nom||'',d.tel||'—',d.email||'—',d.mariage||'','normal','',mar?mar.id:null)}
  nouveau=rdv(c,d.type||'Robe de mariée',d.date||ouvert(1),d.heure||'10:00','attente','site',d.message||'');nouveau.recu=Date.now();
  $('#login .hint').innerHTML='Code de l\'aperçu : 1234<br><b style="color:var(--rose-d)">♡ Une nouvelle demande vient d\'arriver du site !</b>';
})();
const _oldCarte=carte;carte=function(r,o){let h=_oldCarte(r,o);if(nouveau&&r.id===nouveau.id&&r.statut==='attente')h=h.replace('<div class="card">','<div class="card" style="border:2px solid var(--rose);box-shadow:0 0 0 4px var(--blush),0 18px 30px -18px var(--rose-d)"><div style="font-size:11px;letter-spacing:.18em;font-weight:600;color:#fff;background:var(--rose);display:inline-block;padding:4px 10px;border-radius:99px;margin-bottom:10px">♡ NOUVEAU · ARRIVÉ DU SITE</div>');return h};
const enRetard=r=>r.statut==='attente'&&r.recu&&(Date.now()-r.recu)>S.relance.h*3600e3;
const depuis=ms=>{const h=Math.floor((Date.now()-ms)/3600e3);return h<1?'il y a moins d’une heure':h<48?`il y a ${h} h`:`il y a ${Math.floor(h/24)} jours`};
const _carte2=carte;carte=function(r,o){let h=_carte2(r,o);if(r.statut==='attente'&&r.recu){const late=S.relance.on&&enRetard(r);
  const tag=`<div style="font-size:12px;margin:0 0 8px;color:${late?'#B4560E':'var(--ink2)'};font-weight:${late?600:400}">${late?'⏰ ':''}Demande reçue ${depuis(r.recu)}${late?' · à valider vite':''}</div>`;
  const i=h.indexOf('<div class="acts">');if(i>-1)h=h.slice(0,i)+tag+h.slice(i)}return h};
const _loginOk=()=>{if(nouveau){setTimeout(()=>{go('demandes');toast('♡ Nouvelle demande de '+getC(nouveau.cid).prenom+' !');if(S.notif.on)setTimeout(()=>ouvrir(`<h3>📱 SMS reçu par Dori</h3><div style="background:#E9E9EB;border-radius:18px;padding:12px 14px;font-size:15px;line-height:1.45;margin:10px 0">Reflet Ambré · Nouvelle demande de RDV : ${esc(getC(nouveau.cid).prenom)} ${esc(getC(nouveau.cid).nom)}, ${fmtL(nouveau.date)} à ${nouveau.heure} (${nouveau.type.toLowerCase()}). Ouvrez votre panel pour valider ♡</div><p style="font-size:13px;color:var(--ink2)">Dori reçoit ce SMS sur son téléphone dès qu'une cliente réserve sur le site.</p><div class="acts"><button class="b b-ok" onclick="fermer()">OK</button></div>`),3000);coeurs(innerWidth/2,innerHeight*.35,50)},700)}};
new MutationObserver(()=>{if($('#login').classList.contains('out'))_loginOk()}).observe($('#login'),{attributes:true,attributeFilter:['class']});
/* ================= SYNCHRONISATION AVEC LE SERVEUR ================= */
let SNAP={C:new Map(),R:new Map(),S:''},syncEnCours=null;
const snapAll=()=>{SNAP.C=new Map(C.map(c=>[c.id,JSON.stringify(c)]));SNAP.R=new Map(R.map(r=>[r.id,JSON.stringify(r)]));SNAP.S=JSON.stringify(S)};
function changements(){const cc=C.filter(c=>SNAP.C.get(c.id)!==JSON.stringify(c)),rr=R.filter(r=>SNAP.R.get(r.id)!==JSON.stringify(r));
  const supprRdv=[...SNAP.R.keys()].filter(id=>!R.some(r=>r.id===id)),supprC=[...SNAP.C.keys()].filter(id=>!C.some(c=>c.id===id));
  const s=JSON.stringify(S);return{cc,rr,supprRdv,supprC,s:s!==SNAP.S?S:null,n:cc.length+rr.length+supprRdv.length+supprC.length+(s!==SNAP.S?1:0)}}
function RA_sync(){if(!LIVE||!JETON)return Promise.resolve();if(syncEnCours)return syncEnCours.then(()=>RA_sync());
  const x=changements();if(!x.n)return Promise.resolve();
  const body={clientes:x.cc,rdv:x.rr,supprRdv:x.supprRdv,supprC:x.supprC};if(x.s)body.S=x.s;
  const avant={C:x.cc.map(c=>[c.id,JSON.stringify(c)]),R:x.rr.map(r=>[r.id,JSON.stringify(r)]),S:x.s?JSON.stringify(x.s):null};
  syncEnCours=API('sync',body).then(d=>{if(d.ok){avant.C.forEach(([k,v])=>SNAP.C.set(k,v));avant.R.forEach(([k,v])=>SNAP.R.set(k,v));x.supprRdv.forEach(k=>SNAP.R.delete(k));x.supprC.forEach(k=>SNAP.C.delete(k));if(avant.S)SNAP.S=avant.S;$('#hors')&&($('#hors').hidden=true)}else throw 0})
    .catch(()=>{$('#hors')&&($('#hors').hidden=false)}).finally(()=>{syncEnCours=null});return syncEnCours}
async function RA_charger(){const d=await API('charger');if(!d.ok)throw new Error(d.erreur);
  C.length=0;R.length=0;d.C.forEach(c=>{c.amendes=c.amendes||[];C.push(c)});d.R.forEach(r=>R.push(r));
  if(d.S){Object.keys(d.S).forEach(k=>{S[k]=d.S[k]})}
  snapAll();if(!d.S)SNAP.S='';return d}
const occupe=()=>$('#ov').classList.contains('open')||['INPUT','TEXTAREA','SELECT'].includes((document.activeElement||{}).tagName);
async function RA_rafraichir(){if(!LIVE||!JETON||!$('#login').classList.contains('out'))return;await RA_sync();if(changements().n||occupe())return;
  const avant=R.filter(r=>r.statut==='attente').map(r=>r.id);const vieux=JSON.stringify([C,R]);
  try{await RA_charger()}catch(e){return}
  if(JSON.stringify([C,R])!==vieux){const nv=R.filter(r=>r.statut==='attente'&&!avant.includes(r.id));if(V!=='site'&&V!=='reglages'&&V!=='sms')render();else{const n=R.filter(r=>r.statut==='attente').length;$('#bdg').hidden=!n;$('#bdg').textContent=n}
    if(nv.length){ding('rdv');toast('♡ Nouvelle demande de '+((getC(nv[0].cid)||{}).prenom||'une cliente')+' !');coeurs(innerWidth/2,innerHeight*.35,40);if(navigator.vibrate)navigator.vibrate([40,60,40])}}}
if(LIVE){
  document.querySelectorAll('.demo-note').forEach(e=>e.remove());
  $('#login .hint').innerHTML='Tapez votre code ♡';
  document.body.insertAdjacentHTML('beforeend','<div id="hors" hidden style="position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:300;background:#9A3B2E;color:#fff;font-size:12px;padding:6px 12px;border-radius:99px">⚠ Hors connexion · vos changements seront envoyés dès le retour d\'internet</div>');
  new MutationObserver(()=>document.querySelectorAll('.demo-note').forEach(e=>e.remove())).observe(document.body,{childList:true,subtree:true});
  setInterval(()=>RA_sync(),2500);setInterval(()=>RA_rafraichir(),30000);
  addEventListener('visibilitychange',()=>{if(!document.hidden)RA_rafraichir()});
  addEventListener('beforeunload',e=>{if(changements().n){RA_sync();e.preventDefault()}});
  // reconnexion automatique si le téléphone est déjà connecté
  const ac=LS.get('ra_acces');if(JETON&&ac){RA_charger().then(()=>{CUR=Object.assign({},S.acces.find(a=>a.id===ac.id)||ac);appliquerRole();$('#login').classList.add('out');render()}).catch(()=>{})}
}
render();

function hjSuppr(j,h){S.heuresJour=JSON.parse(JSON.stringify(S.heuresJour||{}));S.heuresJour[j]=(S.heuresJour[j]||[]).filter(x=>x!==h);vReglages()}
function hjAjout(j){const v=$('#hj'+j).value;if(!v)return;S.heuresJour=JSON.parse(JSON.stringify(S.heuresJour||{}));const L=S.heuresJour[j]||[];if(!L.includes(v))L.push(v);L.sort();S.heuresJour[j]=L;vReglages();toast('Heure ajoutée ♡')}
</script>
